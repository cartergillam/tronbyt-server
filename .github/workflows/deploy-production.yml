name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      apps_commit:
        description: Full SHA of the reviewed tronbyt-apps commit to deploy
        required: true
        type: string
        default: a0746987a714c18632ba10169d809b51ea191cd5
      image_digest:
        description: Approved immutable image digest (sha256)
        required: true
        type: string
        default: sha256:acfab7dfc4abaecae4701aac33d375a1bb5ace5cbb79256882e1461d202d2001

permissions:
  contents: read

concurrency:
  group: tronbyt-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web service
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      APPS_COMMIT: ${{ inputs.apps_commit }}
      SERVER_IMAGE_DIGEST: ${{ inputs.image_digest }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment input
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [[ ! "$APPS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "apps_commit must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if [[ ! "$SERVER_IMAGE_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "image_digest must be a sha256 digest." >&2
            exit 1
          fi

      - name: Deploy prebuilt image on Oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          ssh_dir="$(mktemp -d)"
          remote_report="$(mktemp)"
          cleanup() {
            rm -rf "$ssh_dir"
            rm -f "$remote_report"
          }
          trap cleanup EXIT

          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"

          set +e
          ssh \
            -i "$ssh_dir/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o LogLevel=ERROR \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$ORACLE_USER@$ORACLE_HOST" "APPS_COMMIT='$APPS_COMMIT' SERVER_IMAGE_DIGEST='$SERVER_IMAGE_DIGEST' bash -s" > "$remote_report" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          set +x

          compose_dir="/home/ubuntu/tronbyt/server"
          override_file="docker-compose.override.yaml"
          image_repo="ghcr.io/cartergillam/tronbyt-server"
          image_ref="$image_repo@$SERVER_IMAGE_DIGEST"
          image_override=".tronbyt-deploy-image.yaml"
          deployment_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deployment_id="$(date -u +%Y%m%dT%H%M%SZ)"
          old_image_id="unavailable"
          old_image_ref="unavailable"
          rollback_image_ref="unavailable"
          new_image_id="unavailable"
          new_image_created="unavailable"
          backup_file="unavailable"
          backup_dir="unavailable"
          current_apps_sha="unavailable"
          old_image_digest="unavailable"
          backup_database_integrity="unavailable"
          backup_assets_sha256="unavailable"

          failure_summary() {
            exit_code="$1"
            trap - EXIT ERR
            printf 'DEPLOYMENT_RESULT=failed\n'
            printf 'DEPLOYMENT_TIMESTAMP=%s\n' "$deployment_timestamp"
            printf 'APPS_COMMIT=%s\n' "$APPS_COMMIT"
            printf 'OLD_IMAGE_ID=%s\n' "$old_image_id"
            printf 'OLD_IMAGE_REF=%s\n' "$old_image_ref"
            printf 'OLD_IMAGE_DIGEST=%s\n' "$old_image_digest"
            printf 'ROLLBACK_IMAGE_REF=%s\n' "$rollback_image_ref"
            printf 'CURRENT_APPS_SHA=%s\n' "$current_apps_sha"
            printf 'BACKUP_DIR=%s\n' "$backup_dir"
            printf 'NEW_IMAGE_ID=%s\n' "$new_image_id"
            printf 'APPS_OVERRIDE_BACKUP=%s\n' "$backup_file"
            printf 'BACKUP_DATABASE_INTEGRITY=%s\n' "$backup_database_integrity"
            printf 'BACKUP_ASSETS_SHA256=%s\n' "$backup_assets_sha256"
            if [ "$old_image_id" != "unavailable" ] && [ "$backup_file" != "unavailable" ] && [ "$rollback_image_ref" != "unavailable" ]; then
              printf 'ROLLBACK_1=cd %s && cp -p %s %s\n' "$compose_dir" "$backup_file" "$override_file"
              rollback_override_b64="$(printf 'services: {web: {image: "%s"}}\n' "$rollback_image_ref" | base64 -w0)"
              printf 'ROLLBACK_2=printf %%s %q | base64 -d > .tronbyt-rollback-image.yaml\n' "$rollback_override_b64"
              printf 'ROLLBACK_3=docker compose -f docker-compose.yaml -f docker-compose.override.yaml -f .tronbyt-rollback-image.yaml up -d --no-deps --force-recreate web\n'
              printf 'ROLLBACK_4=rm -f .tronbyt-rollback-image.yaml %s\n' "$image_override"
            fi
            exit "$exit_code"
          }
          trap 'exit_code=$?; if [ "$exit_code" -ne 0 ]; then failure_summary "$exit_code"; fi' EXIT

          if [[ ! "$APPS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'ERROR: apps_commit was not a full Git SHA.' >&2
            exit 1
          fi
          APPS_COMMIT="$(printf '%s' "$APPS_COMMIT" | tr '[:upper:]' '[:lower:]')"

          cd "$compose_dir"
          test -f docker-compose.yaml
          test -f "$override_file"
          # Refuse a deployment that would cause server startup to bootstrap an
          # apps checkout. This workflow never clones or pulls the apps repo.
          old_container_id="$(docker compose ps -q web)"
          test -n "$old_container_id"
          data_mount_info="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{printf "%s\t%s\n" .Type .Source}}{{end}}{{end}}' "$old_container_id")"
          if [[ -z "$data_mount_info" || "$data_mount_info" == *$'\n'* || "$data_mount_info" != *$'\t'* ]]; then
            echo 'ERROR: expected exactly one Docker mount at /app/data.' >&2
            exit 1
          fi
          IFS=$'\t' read -r data_mount_type data_dir <<< "$data_mount_info"
          if [[ "$data_mount_type" != "volume" || -z "$data_dir" ]]; then
            echo 'ERROR: /app/data is not backed by a Docker named volume.' >&2
            exit 1
          fi
          data_dir="$(sudo realpath -- "$data_dir")"
          system_apps_dir="$(sudo realpath -- "$data_dir/system-apps")"
          sudo test -e "$system_apps_dir/.git"
          # Root owns the persistent volume on Oracle. Trust only this canonical
          # checkout, for these Git commands; do not alter global Git config.
          test "$(sudo git -c "safe.directory=$system_apps_dir" -C "$system_apps_dir" remote get-url origin)" = "https://github.com/cartergillam/apps.git"
          test "$(sudo git -c "safe.directory=$system_apps_dir" -C "$system_apps_dir" branch --show-current)" = "feature/mlb-clock-reliability"

          current_apps_sha=$(sudo git -c "safe.directory=$system_apps_dir" -C "$system_apps_dir" rev-parse HEAD)
          old_image_id="$(docker inspect --format '{{.Image}}' "$old_container_id")"
          old_image_ref="$(docker inspect --format '{{.Config.Image}}' "$old_container_id")"
          old_image_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$old_image_id" 2>/dev/null || echo '[]')"
          old_image_digest="$(printf '%s' "$old_image_digests" | sed -nE 's/.*@(sha256:[0-9a-f]{64}).*/\1/p' | head -1)"
          rollback_image_ref="$image_repo:rollback-$deployment_id"
          docker tag "$old_image_id" "$rollback_image_ref"
          current_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$old_container_id")"
          current_status="$(docker inspect --format '{{.State.Status}}' "$old_container_id")"
          if [[ "$current_health" != "healthy" || "$current_status" != "running" ]]; then
            echo "ERROR: current web container is not healthy and running." >&2
            exit 1
          fi

          backup_root="/home/ubuntu/tronbyt/backups"
          install -m 700 -d "$backup_root"
          chmod 700 "$backup_root"
          backup_dir="$(mktemp -d "$backup_root/predeploy-$deployment_id.XXXXXX")"
          chmod 700 "$backup_dir"
          backup_file="$backup_dir/$override_file"
          cp -p docker-compose.yaml "$backup_dir/docker-compose.yaml"
          cp -p "$override_file" "$backup_file"
          if [ -f .env ]; then cp -p .env "$backup_dir/.env"; fi
          # The resolved config may contain secrets. Keep it mode 600 in the
          # private backup directory and never print or upload it.
          docker compose config > "$backup_dir/compose-resolved.yaml"

          sudo python3 - "$data_dir/tronbyt.db" "$backup_dir/tronbyt.db" <<'PY'
          import os
          import sqlite3
          import sys
          source = sqlite3.connect("file:" + sys.argv[1] + "?mode=ro", uri=True)
          target = sqlite3.connect(sys.argv[2])
          source.backup(target)  # includes committed WAL contents
          result = target.execute("PRAGMA integrity_check").fetchone()[0]
          target.close()
          source.close()
          if result != "ok" or not os.path.isfile(sys.argv[2]) or os.path.getsize(sys.argv[2]) == 0:
              raise SystemExit("SQLite backup integrity/size check failed")
          PY
          sudo tar -czf "$backup_dir/persistent-assets.tar.gz" -C "$data_dir" webp firmware
          test -s "$backup_dir/persistent-assets.tar.gz"
          tar -tzf "$backup_dir/persistent-assets.tar.gz" >/dev/null
          sudo chown -R "$(id -un):$(id -gn)" "$backup_dir"
          find "$backup_dir" -type f -exec chmod 600 {} +
          device_poll_state=$(sudo python3 - "$data_dir/tronbyt.db" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("file:" + sys.argv[1] + "?mode=ro", uri=True)
          for device_id, last_seen in db.execute("SELECT id, last_seen FROM devices WHERE id IN (?, ?)", ("ben-frame", "carter-frame")):
              print(f"{device_id}_LAST_SEEN={last_seen or 'never'}")
          db.close()
          PY
          )
          cat > "$backup_dir/metadata.txt" <<EOF
          backup_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          previous_image_id=$old_image_id
          previous_image_ref=$old_image_ref
          previous_image_digests=$old_image_digests
          previous_apps_sha=$current_apps_sha
          current_health=$current_health
          current_status=$current_status
          device_poll_state=$device_poll_state
          compose_sha256=$(sha256sum "$backup_dir/docker-compose.yaml" | cut -d' ' -f1)
          override_sha256=$(sha256sum "$backup_file" | cut -d' ' -f1)
          EOF
          find "$backup_dir" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$backup_dir/SHA256SUMS"
          chmod 600 "$backup_dir/SHA256SUMS"
          (cd "$backup_dir" && sha256sum -c SHA256SUMS)
          python3 - "$backup_dir/tronbyt.db" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("file:" + sys.argv[1] + "?mode=ro&immutable=1", uri=True)
          result = db.execute("PRAGMA integrity_check").fetchone()[0]
          db.close()
          if result != "ok":
              raise SystemExit("SQLite backup failed the final integrity check")
          print("BACKUP_DATABASE_INTEGRITY=" + result)
          PY
          backup_database_integrity=ok
          backup_assets_sha256="$(sha256sum "$backup_dir/persistent-assets.tar.gz" | cut -d' ' -f1)"
          printf 'BACKUP_DIR=%s\n' "$backup_dir"
          printf 'BACKUP_DATABASE_SHA256=%s\n' "$(sha256sum "$backup_dir/tronbyt.db" | cut -d' ' -f1)"
          printf 'BACKUP_ASSETS_SHA256=%s\n' "$(sha256sum "$backup_dir/persistent-assets.tar.gz" | cut -d' ' -f1)"
          printf 'CURRENT_APPS_SHA=%s\n' "$current_apps_sha"
          printf 'CURRENT_IMAGE_ID=%s\n' "$old_image_id"
          printf 'CURRENT_IMAGE_DIGEST=%s\n' "$old_image_digest"
          printf 'ROLLBACK_IMAGE_REF=%s\n' "$rollback_image_ref"
          printf 'CURRENT_CONTAINER_STATE=%s\n' "$current_status"
          printf 'CURRENT_CONTAINER_HEALTH=%s\n' "$current_health"
          printf '%s\n' "$device_poll_state"

          image_digest_ref="$image_repo@$SERVER_IMAGE_DIGEST"
          printf 'services:\n  web:\n    image: %s\n' "$image_digest_ref" > "$image_override"
          chmod 600 "$image_override"
          docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" config -q

          python3 - "$override_file" "$APPS_COMMIT" <<'PY'
          import os
          import re
          import stat
          import sys

          path, expected_commit = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              lines = source.readlines()

          def value_for(name):
              patterns = (
                  re.compile(r"^\s*-\s*" + re.escape(name) + r"=(.*?)(?:\s+#.*)?\s*$"),
                  re.compile(r"^\s*" + re.escape(name) + r"\s*:\s*(.*?)(?:\s+#.*)?\s*$"),
              )
              values = []
              for line in lines:
                  for pattern in patterns:
                      match = pattern.match(line)
                      if match:
                          values.append(match.group(1).strip().strip("\"'"))
              if len(values) != 1:
                  raise SystemExit("expected exactly one " + name + " entry in docker-compose.override.yaml")
              return values[0]

          if value_for("SYSTEM_APPS_REPO") != "https://github.com/cartergillam/apps.git":
              raise SystemExit("SYSTEM_APPS_REPO does not match the production apps repository")
          if value_for("SYSTEM_APPS_REF") != "feature/mlb-clock-reliability":
              raise SystemExit("SYSTEM_APPS_REF does not match the production apps ref")

          replace_patterns = (
              re.compile(r"^(\s*-\s*SYSTEM_APPS_EXPECTED_COMMIT=)([^#\r\n]*)(\s*(?:#.*)?)(\r?\n?)$"),
              re.compile(r"^(\s*SYSTEM_APPS_EXPECTED_COMMIT\s*:\s*)([^#\r\n]*)(\s*(?:#.*)?)(\r?\n?)$"),
          )
          changed = 0
          updated = []
          for line in lines:
              for pattern in replace_patterns:
                  match = pattern.match(line)
                  if match:
                      line = match.group(1) + expected_commit + match.group(3) + match.group(4)
                      changed += 1
                      break
              updated.append(line)
          if changed != 1:
              raise SystemExit("expected exactly one SYSTEM_APPS_EXPECTED_COMMIT entry in docker-compose.override.yaml")

          mode = stat.S_IMODE(os.stat(path).st_mode)
          temporary = path + ".deployment-tmp"
          with open(temporary, "w", encoding="utf-8") as destination:
              destination.writelines(updated)
          os.chmod(temporary, mode)
          os.replace(temporary, path)
          PY

          # Validate Compose without emitting resolved environment values.
          docker compose config -q

          docker pull "$image_ref"
          new_image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          new_image_created="$(docker image inspect --format '{{.Created}}' "$image_ref")"
          new_image_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image_ref")"
          if [[ "$new_image_digests" != *"$image_ref"* ]]; then
            echo 'ERROR: pulled image does not report the requested immutable digest.' >&2
            exit 1
          fi
          docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" up -d --no-deps --force-recreate web
          docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" ps web

          deadline=$((SECONDS + 300))
          container_id=""
          health="starting"
          status="created"
          while [ "$SECONDS" -lt "$deadline" ]; do
            container_id="$(docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" ps -q web)"
            test -n "$container_id"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            status="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            if [ "$health" = "healthy" ] && [ "$status" = "running" ]; then
              break
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              echo "ERROR: web container stopped before becoming healthy." >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$health" != "healthy" ] || [ "$status" != "running" ]; then
            echo "ERROR: web container did not become healthy within five minutes." >&2
            exit 1
          fi

          restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_id")"
          startup_logs="$(docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" logs --no-color --tail=250 web | grep -Ei 'System apps checkout|System apps refresh|fatal|error|warn' || true)"
          if [ -n "$startup_logs" ]; then
            printf '%s\n' "$startup_logs" | sed -E 's/((token|secret|password|authorization|apikey)[^=[:space:]]*[=:])[[:space:]]*[^[:space:]]+/\1[REDACTED]/Ig'
          fi
          if ! docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" logs --no-color --tail=250 web | grep -F 'System apps checkout ready' | grep -F "commit=$APPS_COMMIT" | grep -F 'update_succeeded=true' >/dev/null; then
            echo 'ERROR: startup logs did not confirm the requested system-apps commit.' >&2
            exit 1
          fi
          if docker compose -f docker-compose.yaml -f "$override_file" -f "$image_override" logs --no-color --tail=250 web | grep -Eqi 'System apps checkout failed|\bfatal\b'; then
            echo 'ERROR: startup logs contain a fatal apps-checkout condition.' >&2
            exit 1
          fi

          deployed_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          if [[ "$deployed_image_id" != "$new_image_id" ]]; then
            echo 'ERROR: running container image ID differs from the approved pulled image.' >&2
            exit 1
          fi
          deployed_repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$deployed_image_id")"
          if [[ "$deployed_repo_digests" != *"$image_digest_ref"* ]]; then
            echo 'ERROR: running image is not associated with the approved digest.' >&2
            exit 1
          fi
          rm -f "$image_override"
          printf 'DEPLOYMENT_RESULT=success\n'
          printf 'DEPLOYMENT_TIMESTAMP=%s\n' "$deployment_timestamp"
          printf 'APPS_COMMIT=%s\n' "$APPS_COMMIT"
          printf 'OLD_IMAGE_ID=%s\n' "$old_image_id"
          printf 'OLD_IMAGE_REF=%s\n' "$old_image_ref"
          printf 'OLD_IMAGE_DIGEST=%s\n' "$old_image_digest"
          printf 'NEW_IMAGE_ID=%s\n' "$new_image_id"
          printf 'NEW_IMAGE_DIGEST=%s\n' "$SERVER_IMAGE_DIGEST"
          printf 'NEW_IMAGE_REPO_DIGESTS=%s\n' "$deployed_repo_digests"
          printf 'NEW_IMAGE_CREATED=%s\n' "$new_image_created"
          printf 'CONTAINER_HEALTH=%s\n' "$health"
          printf 'CONTAINER_STATUS=%s\n' "$status"
          printf 'RESTART_COUNT=%s\n' "$restart_count"
          printf 'APPS_OVERRIDE_BACKUP=%s\n' "$backup_file"
          REMOTE
          ssh_status=$?
          set -e

          cat "$remote_report"
          {
            echo '## Tronbyt production deployment'
            echo
            grep -E '^(DEPLOYMENT_RESULT|DEPLOYMENT_TIMESTAMP|APPS_COMMIT|OLD_IMAGE_ID|OLD_IMAGE_REF|OLD_IMAGE_DIGEST|ROLLBACK_IMAGE_REF|CURRENT_APPS_SHA|CURRENT_IMAGE_ID|CURRENT_IMAGE_DIGEST|CURRENT_CONTAINER_STATE|CURRENT_CONTAINER_HEALTH|NEW_IMAGE_ID|NEW_IMAGE_DIGEST|NEW_IMAGE_REPO_DIGESTS|NEW_IMAGE_CREATED|CONTAINER_HEALTH|CONTAINER_STATUS|RESTART_COUNT|APPS_OVERRIDE_BACKUP|BACKUP_DIR|BACKUP_DATABASE_INTEGRITY|BACKUP_DATABASE_SHA256|BACKUP_ASSETS_SHA256|ROLLBACK_)=' "$remote_report" || true
            echo
            if [ "$ssh_status" -eq 0 ]; then
              echo 'Result: deployment completed successfully.'
            else
              echo 'Result: deployment failed. The old image and rollback instructions above were preserved for operator review.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$ssh_status"
